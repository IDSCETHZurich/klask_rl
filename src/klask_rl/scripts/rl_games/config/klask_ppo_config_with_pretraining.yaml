params:
  seed: 3
  env:
    clip_observations: 10.0
    clip_actions: 1.0
  algo:
    name: a2c_continuous
  model:
    name: continuous_a2c_logstd
  network:
    name: actor_critic
    separate: false
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: true
    mlp:
      units:
        - 256
        - 128
        - 64
      activation: elu
      d2rl: false
      initializer:
        name: default
      regularizer:
        name: None
  load_checkpoint: true
  load_path: /workspace/klask_rl/logs/rl_games/klask/pretrained_agent_action_1.0/nn/last_klask_ep_35_rew_3.9405801.pth
  config:
    full_experiment_name: new_agent_from_pretrained/new_AM/
    name: klask
    env_name: rlgpu
    device: cuda:0
    device_name: cuda:0
    multi_gpu: false
    ppo: true
    mixed_precision: true
    normalize_input: true
    normalize_value: true
    num_actors: -1
    reward_shaper:
      scale_value: 1.0
    normalize_advantage: true
    gamma: 0.996
    tau: 0.95
    learning_rate: 1.0e-4
    lr_schedule: adaptive
    kl_threshold: 0.01
    max_epochs: -1
    max_frames: 10000000000
    save_best_after: 50
    save_frequency: 25
    grad_norm: 0.4
    entropy_coef: 0.0
    truncate_grads: true
    e_clip: 0.2
    horizon_length: 128
    minibatch_size: 4096
    mini_epochs: 8
    critic_coef: 2.0
    clip_value: true
    seq_length: 128
    bounds_loss_coef: 1.0e-7
    self_play: true
    games_to_track: 4096
    self_play_config:
      check_scores: true
      update_score: 0.3
      games_to_check: 1
      env_update_num: 4096
    train_dir: /home/student/klask_rl/IsaacLab/logs/rl_games/klask
env:
  obs_noise: 0.0
  sim_dt: 0.001
  decimation: 20
  episode_length_s: 10.0
  max_velocity: 0.4 # [m/s] Maximum velocity for player movement
  max_acceleration: 10.0 # [m/s^2] Max rate-of-change; null to disable rate limiting
  ball_reset_position_x: [ -0.15, 0.15 ]
  ball_reset_position_y: [ -0.1, 0.1 ]
  actuator_model:
    enable: true
    checkpoint: /workspace/klask_rl/logs/actuator_model/data/new/checkpoints/model_data_odrive_new_estimator_history_10_interval_0.02_delay_0.0_horizon3_with_states_train_seed0.pt
  collision_avoidance:
    enable: true
initialization:
  init_velocity:
    type: schedule
    phases:
      - type: static
        speed: 1.0
        steps: [ 0, 1_000_000 ]
      - type: sigmoid
        speed: [ 1.0, 0.0 ]
        steps: [ 1_000_000, 3_000_000 ]
        steepness: 6.0
      - type: static
        speed: 0.0
        steps: [ 3_000_000, -1 ]
rewards:
  time_punishment:
    type: static
    weight: 0.0
  time_out_punishment:
    type: static
    weight: 0.0
  shot_over_middle_line:
    type: exponential
    weight: 0.0
    decay_rate: 1.0e-7
  player_in_goal:
    type: static
    weight: -150
  opponent_in_goal:
    type: static
    weight: 0.0
  goal_scored:
    type: static
    weight: 250.0/workspace/isaaclab/_isaac_sim/python.sh scripts/rl_games/train_klask.py     --config /workspace/klask_rl/scripts/rl_games/config/klask_ppo_config_with_pretraining.yaml     --headless  --num_envs 4096   --wandb-project-name KLASK_PPO
  goal_conceded:
    type: static
    weight: -150
  distance_player_ball_own_half:
    type: exponential
    weight: 0.0
    decay_rate: 1.0e-7
  distance_ball_opponent_goal:
    type: exponential
    weight: 10.1
    decay_rate: 1.0e-7
  distance_ball_own_goal:
    type: exponential
    weight: -10.1
    decay_rate: 1.0e-7
  ball_speed:
    type: exponential
    weight: 0.0/workspace/isaaclab/_isaac_sim/python.sh scripts/rl_games/train_klask.py     --config /workspace/klask_rl/scripts/rl_games/config/klask_ppo_config_with_pretraining.yaml     --headless  --num_envs 4096   --wandb-project-name KLASK_PPO
    decay_rate: 1.0e-7
  ball_stationary:
    type: static
    weight: -0.5
  collision_player_ball:
    type: exponential
    weight: 0.5
    decay_rate: 1.0e-7
  ball_in_own_half:
    type: exponential
    weight: 0.0
    decay_rate: 1.0e-7
  close_to_boundaries:
    type: exponential
    weight: -0.01
    decay_rate: 1.0e-7
  player_strategically_positioned:
    type: exponential
    weight: 0.0
    decay_rate: 1.0e-7
terminations:
  time_out: true
  goal_scored: true
  goal_conceded: true
  player_in_goal: true
  opponent_in_goal: true
domain_randomization:
  ball_mass:
    enable: false
    range: [ 0.0013, 0.0021 ]
  material_ball:
    enable: false
    static_friction_range: [ 0.1, 0.28 ] # [0.2, 0.5] # s2r: [0.1, 0.5]
    dynamic_friction_range: [ 0.06, 0.2 ] # [0.3, 0.45] # s2r: [0.2, 0.4]
    restitution_range: [ 0.25, 0.6 ] # [0.95, 0.99] # s2r: [0.25, 0.4]
  material_board:
    enable: false
    static_friction_range: [ 0.04, 0.14 ]
    dynamic_friction_range: [ 0.02, 0.1 ]
    restitution_range: [ 0.05, 0.3 ]
  material_peg:
    enable: false
    static_friction_range: [ 0.04, 0.14 ]
    dynamic_friction_range: [ 0.02, 0.1 ]
    restitution_range: [ 0.05, 0.3 ]
  actuator:
    enable: false
    x_damping_range: [ 10.0, 10.0 ]
    y_damping_range: [ 100.0, 100.0 ]
