params:
  seed: 3
  env:
    clip_observations: 10.0
    clip_actions: 0.6
  algo:
    name: a2c_continuous
  model:
    name: continuous_a2c_logstd
  network:
    name: actor_critic
    separate: false
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: true
    mlp:
      units:
        - 256
        - 128
        - 64
      activation: elu
      d2rl: false
      initializer:
        name: default
      regularizer:
        name: None
  load_checkpoint: false
  load_path: ''
  config:
    full_experiment_name: new_agent_from_pretrained/new_curriculum/no_pretraining/
    name: klask
    env_name: rlgpu
    device: cuda:0
    device_name: cuda:0
    multi_gpu: false
    ppo: true
    mixed_precision: true
    normalize_input: true
    normalize_value: true
    num_actors: -1
    reward_shaper:
      scale_value: 1.0
    normalize_advantage: true
    gamma: 0.996
    tau: 0.95
    learning_rate: 1e-4
    lr_schedule: adaptive
    kl_threshold: 0.01
    max_epochs: -1
    max_frames: 10000000000
    save_best_after: 50
    save_frequency: 25
    grad_norm: 0.4
    entropy_coef: 0.0
    truncate_grads: true
    e_clip: 0.2
    horizon_length: 128
    minibatch_size: 4096
    mini_epochs: 8
    critic_coef: 2.0
    clip_value: true
    seq_length: 128
    bounds_loss_coef: 1.0e-07
    self_play: true
    games_to_track: 4096
    self_play_config:
      check_scores: true
      update_score: 0.3
      games_to_check: 1
      env_update_num: 4096
    train_dir: /home/student/klask_rl/IsaacLab/logs/rl_games/klask
env:
  obs_noise: 0.0
  actuator_model: true
  collision_avoidance: false
rewards:
  time_punishment:
    type: schedule
    phases:
      - type: static
        weight: -0.025
        steps: [0, 2000000]
      - type: static
        weight: 0.0
        steps: [2000000, -1]
  time_out_punishment:
    type: static
    weight: 0.0
  shot_over_middle_line:
    type: schedule
    phases:
      - type: exponential
        weight: 500.0
        decay_rate: 1.0e-7
        steps: [0, 2000000]
      - type: static
        weight: 0.0
        steps: [2000000, -1]
  player_in_goal:
    type: schedule
    phases:
      - type: static
        weight: -50.0
        steps: [0, 2000000]
      - type: static
        weight: -150.0
        steps: [2000000, -1]
  opponent_in_goal:
    type: static
    weight: 0.0
  goal_scored:
    type: static
    weight: 250.0
  goal_conceded:
    type: schedule
    phases:
      - type: static
        weight: -50.0
        steps: [0, 2000000]
      - type: static
        weight: -150.0
        steps: [2000000, -1]
  distance_player_ball_own_half:
    type: static
    weight: 0.0
  distance_ball_opponent_goal:
    type: schedule
    phases:
      - type: static
        weight: 0.0
        steps: [0, 2000000]
      - type: exponential
        weight: 10.1
        decay_rate: 1.0e-7
        steps: [2000000, -1]
  distance_ball_own_goal:
    type: schedule
    phases:
      - type: static
        weight: 0.0
        steps: [0, 2000000]
      - type: exponential
        weight: -10.1
        decay_rate: 1.0e-7
        steps: [2000000, -1]
  ball_speed:
    type: schedule
    phases:
      - type: exponential
        weight: 5.0
        decay_rate: 1.0e-7
        steps: [0, 2000000]
      - type: static
        weight: 0.0
        steps: [2000000, -1]
  ball_stationary:
    type: schedule
    phases:
      - type: static
        weight: -0.005
        steps: [0, 2000000]
      - type: static
        weight: -0.5
        steps: [2000000, -1]
  collision_player_ball:
    type: schedule
    phases:
      - type: exponential
        weight: 15.1003
        decay_rate: 1.0e-7
        steps: [0, 2000000]
      - type: exponential
        weight: 0.5
        decay_rate: 1.0e-7
        steps: [2000000, -1]
  ball_in_own_half:
    type: schedule
    phases:
      - type: exponential
        weight: 0.001
        decay_rate: 1.0e-7
        steps: [0, 2000000]
      - type: static
        weight: 0.0
        steps: [2000000, -1]
  close_to_boundaries:
    type: schedule
    phases:
      - type: static
        weight: 0.0
        steps: [0, 2000000]
      - type: exponential
        weight: -0.01
        decay_rate: 1.0e-7
        steps: [2000000, -1]
  player_strategically_positioned:
    type: static
    weight: 0.0

terminations:
  time_out: true
  goal_scored: true
  goal_conceded: true
  player_in_goal: true
  opponent_in_goal: true
domain_randomization:
  ball_mass:
    enable: false
  material_ball:
    enable: false
  material_klask:
    enable: false
  actuator:
    enable: false
