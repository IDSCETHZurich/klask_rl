# State study protocol point, each player on its own hardware (2026-10-14): the state-based V3
# v2_1m_s80_eff (1m_s80_eff trained on the v2 table) at 1M env steps plays on the v2 physics, PPO-B (trained on the
# v1 table) on the v1 physics, in the same match. Exact opponent command, aligned timing, 30 s games, default
# starts, 200 games (two legs of 100, sides swapped; each seat's hardware follows its agent). PPO-B: evaluation
# only. Same as state_v2_1ms80eff_1m_exact_vs_ppob.yaml except `hardware` and the match id.
#
# Per-agent hardware (match_hardware.py, `per_agent`): our agent's seat (action columns, collision avoidance) runs the
# v2 training block (config-sprite-v3-state-1m-v2sim-eff.yaml): max_velocity 1.4 m/s per axis, max_acceleration 35
# m/s^2, learned v1 actuator model off, actuator_lag (5 ms dead time, 10 ms first-order lag), collision avoidance on.
# PPO-B's seat runs the v1 block = its training config (agent.yaml env block): 0.4 m/s, 10 m/s^2, learned v1 actuator
# model on, no lag, collision avoidance on. Observations are hardware-independent (raw simulator state); the state
# agent divides by units of its own training max_velocity (1.4).
#
# Caveat (exact condition): the opponent command our agent's world model reads is PPO-B's raw [-1, 1] action, which on
# PPO-B's v1 seat means up to 0.4 m/s (through the learned model), while in training the opponent's [-1, 1] meant up to
# 1.4 m/s on v2. The board itself shows the real (slower) PPO-B peg.
# Checkpoint: copied to logs/experiments/r2_quick_eval/ckpt/ from logs/dreamer/training/v3_state/v2_1m_s80_eff/checkpoint_1000000.pt.
hardware:
  per_agent:
    State-V2-1m-s80-eff-1M: v2
    PPO-B: v1
games: 200
num_envs: 100
episode_length_s: 30.0
seed: 0
bootstrap_samples: 10000
bootstrap_seed: 2026
agents:
  # Environment-config provider required by run_tournament.py (same sprite env as the 1M evaluation; its v1 hardware
  # block is replaced per seat by `hardware` above, everything else - sim_dt 1 ms, decimation 20, observations - is kept).
  D-RSSM:
    kind: dreamer
    checkpoint: logs/dreamer/training/opponent_switch_4m/drssm/checkpoint_4000000.pt
    config: logs/dreamer/training/opponent_switch_4m/drssm/.hydra/config.yaml
  State-V2-1m-s80-eff-1M:
    kind: dreamer
    checkpoint: logs/experiments/r2_quick_eval/ckpt/v2_1m_s80_eff_1000000.pt
    config: logs/dreamer/training/v3_state/v2_1m_s80_eff/.hydra/config.yaml
  PPO-B:
    kind: ppo
    checkpoint: logs/rl_games/klask/new_agent_from_pretrained/new_AM/export/klask_ppo_nn_v1.1.pth
    config: logs/rl_games/klask/new_agent_from_pretrained/new_AM/params/agent.yaml
matches:
  - {id: v2_1ms80eff_1m_ownhw_vs_ppob, a: State-V2-1m-s80-eff-1M, b: PPO-B, condition: exact, primary: false, action_timing: aligned}
