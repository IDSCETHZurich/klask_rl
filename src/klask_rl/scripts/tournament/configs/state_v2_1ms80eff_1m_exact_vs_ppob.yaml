# State study protocol point on the v2-like hardware (2026-10-13): the state-based V3 v2_1m_s80_eff (1m_s80_eff
# trained on the v2 table) at 1M env steps vs PPO-B, exact opponent command, aligned timing, 30 s games, default
# starts, 200 games (two legs of 100, sides swapped). PPO-B: evaluation only.
#
# INDICATIVE ONLY: PPO-B was trained on the v1 table (0.4 m/s, 10 m/s^2, learned v1 actuator model). Here it plays on
# the v2 hardware, where its [-1, 1] commands mean up to 1.4 m/s and its observed peg velocities leave its training
# range; the score mixes agent strength with PPO-B's hardware mismatch. Not comparable with the v1 PPO-B results.
#
# Match hardware: `hardware: v2` replaces the environment provider's v1 block for BOTH seats with the v2 training block
# (config-sprite-v3-state-1m-v2sim-eff.yaml): max_velocity 1.4 m/s per axis, max_acceleration 35 m/s^2, learned v1
# actuator model off, actuator_lag (5 ms dead time, 10 ms first-order lag), collision avoidance on.
# Checkpoint: copied to logs/experiments/r2_quick_eval/ckpt/ from logs/dreamer/training/v3_state/v2_1m_s80_eff/checkpoint_1000000.pt.
hardware: v2
games: 200
num_envs: 100
episode_length_s: 30.0
seed: 0
bootstrap_samples: 10000
bootstrap_seed: 2026
agents:
  # Environment-config provider required by run_tournament.py (same sprite env as the 1M evaluation; its v1 hardware
  # block is replaced by `hardware` above, everything else - sim_dt 1 ms, decimation 20, observations - is kept).
  D-RSSM:
    kind: dreamer
    checkpoint: logs/dreamer/training/opponent_switch_4m/drssm/checkpoint_4000000.pt
    config: logs/dreamer/training/opponent_switch_4m/drssm/.hydra/config.yaml
  State-V2-1m-s80-eff-1M:
    kind: dreamer
    checkpoint: logs/experiments/r2_quick_eval/ckpt/v2_1m_s80_eff_1000000.pt
    config: logs/dreamer/training/v3_state/v2_1m_s80_eff/.hydra/config.yaml
  PPO-B:
    kind: ppo
    checkpoint: logs/rl_games/klask/new_agent_from_pretrained/new_AM/export/klask_ppo_nn_v1.1.pth
    config: logs/rl_games/klask/new_agent_from_pretrained/new_AM/params/agent.yaml
matches:
  - {id: v2_1ms80eff_1m_exact_vs_ppob, a: State-V2-1m-s80-eff-1M, b: PPO-B, condition: exact, primary: false, action_timing: aligned}
