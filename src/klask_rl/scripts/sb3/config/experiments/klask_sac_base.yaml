# ═══════════════════════════════════════════════════════════════════════════════
# KLASK SAC Base Configuration
# ═══════════════════════════════════════════════════════════════════════════════
# Single source of truth for SAC training on Klask environment.
# All hyperparameters needed to reproduce this experiment are in this file.
#
# Usage:
#   python train_sac.py --config experiments/klask_sac_base.yaml
#   python train_sac.py --config experiments/klask_sac_base.yaml agent.learning_rate=1e-4
# ═══════════════════════════════════════════════════════════════════════════════

# ─────────────────────────────────────────────────────────────────────────────────
# TASK
# ─────────────────────────────────────────────────────────────────────────────────
task: Klask-Rl-SAC-v0

# ─────────────────────────────────────────────────────────────────────────────────
# ENVIRONMENT
# ─────────────────────────────────────────────────────────────────────────────────
env:
  num_envs: 4096
  seed: 42
  max_velocity: 0.2 # [m/s] Maximum velocity for player movement

# ─────────────────────────────────────────────────────────────────────────────────
# AGENT - SAC Hyperparameters
# Reference: https://github.com/DLR-RM/stable-baselines3/blob/master/stable_baselines3/sac/sac.py
# ─────────────────────────────────────────────────────────────────────────────────
agent:
  # Policy architecture
  policy: MlpPolicy
  policy_kwargs:
    activation_fn: nn.ReLU
    net_arch: [64, 64]

  # Learning parameters
  learning_rate: 3.0e-4
  buffer_size: 1_000_000
  learning_starts: 1000
  batch_size: 1024
  tau: 0.005
  gamma: 0.99

  # Update frequency
  train_freq: 64 # Update every N env steps
  gradient_steps: 32 # Gradient steps per update

  # Entropy regularization
  ent_coef: auto_0.1 # Fixed low entropy (auto tends to keep it too high)
  target_entropy: auto

  # Target network
  target_update_interval: 1

  # Input normalization
  normalize_input: false

  # Training duration
  n_timesteps: 20_000_000

# ─────────────────────────────────────────────────────────────────────────────────
# TRAINING
# ─────────────────────────────────────────────────────────────────────────────────
training:
  seed: 42
  log_interval: 1000
  checkpoint: null
  export_io_descriptors: false

# ─────────────────────────────────────────────────────────────────────────────────
# LOGGING - Weights & Biases
# ─────────────────────────────────────────────────────────────────────────────────
wandb:
  project: KLASK
  entity: null
  name: sac-base-64x64-dense

# ─────────────────────────────────────────────────────────────────────────────────
# SIMULATION - Isaac Sim App Launcher
# ─────────────────────────────────────────────────────────────────────────────────
app_launcher:
  headless: true
  livestream: 1
  enable_cameras: false
  device: cuda:3
  # Advanced settings (usually don't need to change)
  xr: false
  experience: ""
  rendering_mode: balanced
  kit_args: ""
  anim_recording_enabled: false
  anim_recording_start_time: 0
  anim_recording_stop_time: 10
