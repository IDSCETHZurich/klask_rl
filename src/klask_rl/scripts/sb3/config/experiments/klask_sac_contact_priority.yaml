# ═══════════════════════════════════════════════════════════════════════════════
# KLASK SAC + Contact Priority Configuration
# ═══════════════════════════════════════════════════════════════════════════════
# Sparse rewards with contact-priority replay buffer sampling.
# The replay buffer over-samples transitions from episodes where the agent
# made contact with the ball, configured by contact_ratio (default 80%).
#
# No HER / no goal relabeling — uses flat MlpPolicy with 14-dim observations
# (includes opponent goal position so the agent knows where to score).
#
# Uses the same env config as Two-Stage HER (sparse ball hit + goal scored
# rewards, ball_hit_timeout termination) but without the HER wrapper.
#
# Usage:
#   python train_sac.py --config experiments/klask_sac_contact_priority.yaml
# ═══════════════════════════════════════════════════════════════════════════════

# ─────────────────────────────────────────────────────────────────────────────────
# TASK
# ─────────────────────────────────────────────────────────────────────────────────
task: Klask-Rl-ContactPriority-v0

# ─────────────────────────────────────────────────────────────────────────────────
# ENVIRONMENT
# ─────────────────────────────────────────────────────────────────────────────────
env:
  num_envs: 4096
  seed: 42
  max_velocity: 0.4 # [m/s] Maximum velocity for player movement
  episode_length_s: 10.0 # [s] Episode length in seconds
  ball_reset_position_x: [-0.15, 0.15] # [m]
  ball_reset_position_y: [-0.10, -0.02] # [m]

# ─────────────────────────────────────────────────────────────────────────────────
# AGENT - SAC Hyperparameters
# ─────────────────────────────────────────────────────────────────────────────────
agent:
  # Policy architecture
  policy: MlpPolicy
  policy_kwargs:
    activation_fn: nn.ReLU
    net_arch: [512, 256, 256, 128, 64]

  # Learning parameters
  learning_rate: 3.0e-4
  buffer_size: 1_000_000
  learning_starts: 1000
  batch_size: 1024
  tau: 0.005
  gamma: 0.99

  # Update frequency
  train_freq: 64
  gradient_steps: 32

  # Entropy regularization
  ent_coef: auto_0.1
  target_entropy: auto

  # Target network
  target_update_interval: 1

  # Input normalization
  normalize_input: false

  # Training duration
  n_timesteps: 200_000_000

# ─────────────────────────────────────────────────────────────────────────────────
# CONTACT PRIORITY REPLAY BUFFER
# ─────────────────────────────────────────────────────────────────────────────────
# Observation structure (from TwoStageHerObservationsCfg, 14 dims):
#   - peg_1_pos:      indices 0-2  (player XY position)
#   - peg_1_vel:      indices 2-4  (player velocity)
#   - peg_2_pos:      indices 4-6  (opponent XY position)
#   - peg_2_vel:      indices 6-8  (opponent velocity)
#   - ball_pos:       indices 8-10 (ball XY position)
#   - ball_vel:       indices 10-12 (ball velocity)
#   - opponent_goal:  indices 12-14 (goal center XY)
# ─────────────────────────────────────────────────────────────────────────────────
contact_priority:
  # Sampling ratio: fraction of each batch drawn from contact episodes
  contact_ratio: 0.8

  # Observation indices for contact detection
  player_pos_indices: [0, 2]
  ball_pos_indices: [8, 10]
  goal_pos_indices: [16, 18]

  # Detection thresholds
  ball_hit_threshold: 0.017 # Distance for ball hit detection [m]
  goal_score_threshold: 0.025 # Distance for goal scoring [m]

  # Timeout after ball hit
  ball_hit_timeout: 10.0 # [s] Time after ball hit to terminate episode

  # Reward scales - Environment rewards (RewardsCfgTwoStageHer weights)
  ball_hit_env_reward: 0.0 # collision_player_ball weight
  goal_score_env_reward: 1000.0 # goal_scored weight

# ─────────────────────────────────────────────────────────────────────────────────
# DOMAIN RANDOMIZATION
# ─────────────────────────────────────────────────────────────────────────────────
# Keep all randomization terms disabled for deterministic physics.
domain_randomization:
  ball_mass:
    enable: false
  material_ball:
    enable: false
  material_board:
    enable: false
  material_peg:
    enable: false
  actuator:
    enable: false

# ─────────────────────────────────────────────────────────────────────────────────
# TRAINING
# ─────────────────────────────────────────────────────────────────────────────────
training:
  seed: 42
  log_interval: 1000
  checkpoint: null
  export_io_descriptors: false

# ─────────────────────────────────────────────────────────────────────────────────
# LOGGING - Weights & Biases
# ─────────────────────────────────────────────────────────────────────────────────
wandb:
  project: KLASK_SAC
  entity: null
  name: sac-contact-priority

# ─────────────────────────────────────────────────────────────────────────────────
# SIMULATION - Isaac Sim App Launcher
# ─────────────────────────────────────────────────────────────────────────────────
app_launcher:
  headless: true
  livestream: 1
  enable_cameras: false
  device: cuda:0
  xr: false
  experience: ""
  rendering_mode: balanced
  kit_args: ""
  anim_recording_enabled: false
  anim_recording_start_time: 0
  anim_recording_stop_time: 10
