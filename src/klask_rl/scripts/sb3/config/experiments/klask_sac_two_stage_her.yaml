# ═══════════════════════════════════════════════════════════════════════════════
# KLASK SAC + Two-Stage HER Configuration
# ═══════════════════════════════════════════════════════════════════════════════
# Two-stage Hindsight Experience Replay for hierarchical goal learning:
#   Stage 1: Learn to hit the ball (player → ball)
#   Stage 2: Learn to score a goal (ball → opponent goal)
#
# The wrapper dynamically switches goals based on whether the ball has been hit:
#   Pre-hit:  achieved=player_pos, desired=ball_pos
#   Post-hit: achieved=ball_pos, desired=opponent_goal
#
# NOTE: Rewards are handled by env's RewardsCfgTwoStageHer, not the wrapper.
# The wrapper only converts flat observations to GoalEnv dict format for HER.
#
# Usage:
#   python train_sac.py --config experiments/klask_sac_two_stage_her.yaml
# ═══════════════════════════════════════════════════════════════════════════════

# ─────────────────────────────────────────────────────────────────────────────────
# TASK
# ─────────────────────────────────────────────────────────────────────────────────
task: Klask-Rl-TwoStage-HER-v0

# ─────────────────────────────────────────────────────────────────────────────────
# ENVIRONMENT
# ─────────────────────────────────────────────────────────────────────────────────
env:
  num_envs: 4096
  seed: 42
  max_velocity: 0.2 # [m/s] Maximum velocity for player movement

# ─────────────────────────────────────────────────────────────────────────────────
# AGENT - SAC Hyperparameters
# ─────────────────────────────────────────────────────────────────────────────────
agent:
  # Policy architecture
  policy: MlpPolicy
  policy_kwargs:
    activation_fn: nn.ReLU
    net_arch: [64, 64]

  # Learning parameters
  learning_rate: 3.0e-4
  buffer_size: 1_000_000
  learning_starts: 1000
  batch_size: 1024
  tau: 0.005
  gamma: 0.99

  # Update frequency
  train_freq: 64
  gradient_steps: 32

  # Entropy regularization
  ent_coef: auto_0.1
  target_entropy: auto

  # Target network
  target_update_interval: 1

  # Input normalization
  normalize_input: false

  # Training duration
  n_timesteps: 100_000_000

# ─────────────────────────────────────────────────────────────────────────────────
# HER (Hindsight Experience Replay) - Two-Stage Configuration
# ─────────────────────────────────────────────────────────────────────────────────
# Observation structure (from TwoStageHerObservationsCfg, 14 dims):
#   - peg_1_pos:      indices 0-2  (player XY position)
#   - peg_1_vel:      indices 2-4  (player velocity)
#   - peg_2_pos:      indices 4-6  (opponent XY position)
#   - peg_2_vel:      indices 6-8  (opponent velocity)
#   - ball_pos:       indices 8-10 (ball XY position)
#   - ball_vel:       indices 10-12 (ball velocity)
#   - opponent_goal:  indices 12-14 (goal center XY)
#
# Two-stage goal switching (handled by wrapper):
#   Pre-hit:  achieved=player_pos(0:2), desired=ball_pos(8:10)
#   Post-hit: achieved=ball_pos(8:10), desired=opponent_goal(12:14)
# ─────────────────────────────────────────────────────────────────────────────────
her:
  goal_selection_strategy: final
  n_sampled_goal: 4
  distance_threshold: 0.02 # Used by HER buffer

# ─────────────────────────────────────────────────────────────────────────────────
# TWO-STAGE HER SPECIFIC SETTINGS
# ─────────────────────────────────────────────────────────────────────────────────
two_stage:
  # Observation indices for goal extraction
  player_pos_indices: [0, 2]
  ball_pos_indices: [8, 10]
  goal_pos_indices: [12, 14]

  # Detection thresholds
  ball_hit_threshold: 0.017 # Distance for ball hit detection
  goal_score_threshold: 0.025 # Distance for goal scoring

  # Reward scales - Environment rewards (RewardsCfgTwoStageHer weights)
  ball_hit_env_reward: 500.0 # collision_player_ball weight
  goal_score_env_reward: 5000.0 # goal_scored weight

  # Reward scales - Wrapper rewards (HER compute_reward for hindsight relabeling)
  ball_hit_wrapper_reward: 1.0
  goal_score_wrapper_reward: 10.0

# ─────────────────────────────────────────────────────────────────────────────────
# TRAINING
# ─────────────────────────────────────────────────────────────────────────────────
training:
  seed: 42
  log_interval: 1000
  checkpoint: null
  export_io_descriptors: false

# ─────────────────────────────────────────────────────────────────────────────────
# LOGGING - Weights & Biases
# ─────────────────────────────────────────────────────────────────────────────────
wandb:
  project: KLASK
  entity: null
  name: sac-her-goal-scoring

# ─────────────────────────────────────────────────────────────────────────────────
# SIMULATION - Isaac Sim App Launcher
# ─────────────────────────────────────────────────────────────────────────────────
app_launcher:
  headless: true
  livestream: 1
  enable_cameras: false
  device: cuda:3
  xr: false
  experience: ""
  rendering_mode: balanced
  kit_args: ""
  anim_recording_enabled: false
  anim_recording_start_time: 0
  anim_recording_stop_time: 10
