# ═══════════════════════════════════════════════════════════════════════════════
# KLASK SAC + HER Configuration
# ═══════════════════════════════════════════════════════════════════════════════
# SAC with Hindsight Experience Replay for sparse reward learning.
# Goal: Learn to move the player peg to hit the ball.
#
# HER converts sparse rewards into dense learning signal by relabeling
# failed trajectories with achieved goals as if they were the desired goals.
#
# Usage:
#   python train_sac.py --config experiments/klask_sac_her.yaml
# ═══════════════════════════════════════════════════════════════════════════════

# ─────────────────────────────────────────────────────────────────────────────────
# TASK
# ─────────────────────────────────────────────────────────────────────────────────
task: Klask-Rl-HER-SAC-v0

# ─────────────────────────────────────────────────────────────────────────────────
# ENVIRONMENT
# ─────────────────────────────────────────────────────────────────────────────────
env:
  num_envs: 4096
  seed: 42
  max_velocity: 0.2 # [m/s] Maximum velocity for player movement

# ─────────────────────────────────────────────────────────────────────────────────
# AGENT - SAC Hyperparameters
# ─────────────────────────────────────────────────────────────────────────────────
agent:
  # Policy architecture
  policy: MlpPolicy
  policy_kwargs:
    activation_fn: nn.ReLU
    net_arch: [64, 64]

  # Learning parameters
  learning_rate: 3.0e-4
  buffer_size: 1_000_000
  learning_starts: 1000
  batch_size: 1024
  tau: 0.005
  gamma: 0.99

  # Update frequency
  train_freq: 64
  gradient_steps: 32

  # Entropy regularization
  ent_coef: auto_0.1
  target_entropy: auto

  # Target network
  target_update_interval: 1

  # Input normalization
  normalize_input: false

  # Training duration
  n_timesteps: 100_000_000

# ─────────────────────────────────────────────────────────────────────────────────
# HER (Hindsight Experience Replay)
# ─────────────────────────────────────────────────────────────────────────────────
# Observation structure (from HerObservationsCfg):
#   - peg_1_pos: indices 0-2 (player XY position) → achieved_goal
#   - peg_1_vel: indices 2-4 (player velocity)
#   - peg_2_pos: indices 4-6 (opponent XY position)
#   - peg_2_vel: indices 6-8 (opponent velocity)
#   - ball_pos:  indices 8-10 (ball XY position) → desired_goal
#   - ball_vel:  indices 10-12 (ball velocity)
# ─────────────────────────────────────────────────────────────────────────────────
her:
  goal_selection_strategy: final # 'future', 'final', 'episode', 'random'
  n_sampled_goal: 4 # Virtual transitions per real transition

  # Goal extraction from observation vector
  achieved_goal_indices: [0, 2] # Player position (what we achieved)
  desired_goal_indices: [8, 10] # Ball position (what we wanted to reach)

  # Goal achievement threshold
  distance_threshold: 0.02 # Same as collision detection epsilon

  # Reward scaling
  # env_reward_scale: Weight for actual collisions in environment
  # wrapper_reward_scale: Reward for HER's compute_reward (hindsight relabeling)
  env_reward_scale: 500.0
  wrapper_reward_scale: 1.0

# ─────────────────────────────────────────────────────────────────────────────────
# TRAINING
# ─────────────────────────────────────────────────────────────────────────────────
training:
  seed: 42
  log_interval: 1000
  checkpoint: null
  export_io_descriptors: false

# ─────────────────────────────────────────────────────────────────────────────────
# LOGGING - Weights & Biases
# ─────────────────────────────────────────────────────────────────────────────────
wandb:
  project: KLASK
  entity: null
  name: sac-her-64x64-sparse

# ─────────────────────────────────────────────────────────────────────────────────
# SIMULATION - Isaac Sim App Launcher
# ─────────────────────────────────────────────────────────────────────────────────
app_launcher:
  headless: true
  livestream: 1
  enable_cameras: false
  device: cuda:0
  xr: false
  experience: ""
  rendering_mode: balanced
  kit_args: ""
  anim_recording_enabled: false
  anim_recording_start_time: 0
  anim_recording_stop_time: 10
