# Reference: https://github.com/DLR-RM/stable-baselines3/blob/master/stable_baselines3/sac/sac.py
# SAC configuration for Klask
policy: "MlpPolicy"

# SAC specific parameters
learning_rate: !!float 3e-4
buffer_size: 1_000_000 # Smaller buffer for faster turnover with dense rewards
learning_starts: 1000 # Start learning after collecting more diverse experiences
batch_size: 256 # Smaller batches, more frequent updates
tau: 0.005
gamma: 0.99 # Standard gamma value

# Dense reward strategy:
# - Start learning quickly since we have dense signal
# - Update frequently to learn from proximity gradient
train_freq: 1 # Update every 4 env steps
gradient_steps: 1 # Gradient steps per update

# Lower entropy for simpler task - we want more exploitation
ent_coef: 0.01 # Fixed low entropy (auto tends to keep it too high)
target_entropy: "auto"

# Network architecture
policy_kwargs:
  activation_fn: nn.ReLU
  net_arch: [64, 64]

# Target network update
target_update_interval: 1

# Observation normalization for stable learning
normalize_input: true
